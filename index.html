<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA.in | Indian E-Commerce Platform</title>
  <meta name="description" content="India's premier online shopping platform for Diwali sales, ethnic fashion, electronics, ayurveda, and sports gear." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f4ff',
              100: '#e0e9ff',
              200: '#c7d7fe',
              300: '#a4bcfd',
              400: '#7c96fb',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              accent: '#06b6d4',
              rose: '#f43f5e'
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.2)',
            'glass-light': '0 8px 32px 0 rgba(31, 38, 135, 0.08)',
            'glow': '0 0 20px rgba(99, 102, 241, 0.35)'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-300">
  <div id="root"></div>

  <!-- Client Application Bundle -->
  <script type="text/babel" data-presets="react" src="./public/app.jsx"></script>

  <script>
    // Refresh Lucide icons after DOM render
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, 500);
    });
  </script>
</body>
</html>
